# ==============================================================================
# JTC CARNIVAL — HOST NGINX VIRTUAL HOST CONFIGURATION
# ==============================================================================
# Location on host droplet: /etc/nginx/sites-available/jtc.sjis.edu.bd
#
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/jtc.sjis.edu.bd /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d jtc.sjis.edu.bd -d www.jtc.sjis.edu.bd
# ==============================================================================

# ─── Upstream definitions for JTC Docker Containers ───────────────────────────
upstream jtc_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream jtc_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jtc.sjis.edu.bd www.jtc.sjis.edu.bd;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ─── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://jtc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ─── Django Admin Panel ───────────────────────────────────────────────────
    location /django-admin/ {
        proxy_pass http://jtc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ─── Django Static Assets (Proxy to Backend Whitenoise) ───────────────────
    location /static/ {
        proxy_pass http://jtc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ─── Django Media Uploads ─────────────────────────────────────────────────
    location /media/ {
        proxy_pass http://jtc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ─── Next.js Frontend (Root and all other routes) ─────────────────────────
    location / {
        proxy_pass http://jtc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }
}
