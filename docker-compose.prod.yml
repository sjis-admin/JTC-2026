services:
  # ─── PostgreSQL Database (Internal only, zero host conflicts) ───────────────
  db:
    image: postgres:16-alpine
    container_name: jtc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jtc_carnival_db}
      POSTGRES_USER: ${POSTGRES_USER:-jtc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jtc_secure_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jtc_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jtc_admin} -d ${POSTGRES_DB:-jtc_carnival_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Django 5 Backend (Bound to 127.0.0.1:8055) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jtc_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JTC_BACKEND_PORT:-8055}:8000"
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jtc_admin}:${POSTGRES_PASSWORD:-jtc_secure_password_change_me}@db:5432/${POSTGRES_DB:-jtc_carnival_db}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - jtc_internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/settings/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Next.js 14 Frontend (Bound to 127.0.0.1:3055) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_TURNSTILE_ENABLED: ${NEXT_PUBLIC_TURNSTILE_ENABLED:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: jtc_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JTC_FRONTEND_PORT:-3055}:3000"
    env_file:
      - .env.prod
    environment:
      - INTERNAL_API_URL=http://backend:8000/api
    networks:
      - jtc_internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: jtc_postgres_data
  static_volume:
    name: jtc_static_volume
  media_volume:
    name: jtc_media_volume

networks:
  jtc_internal:
    name: jtc_internal_network
    driver: bridge
